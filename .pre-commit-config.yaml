# Local quality gates. Install once with:  pre-commit install
# (installs the pre-commit and pre-push hooks listed in default_install_hook_types)
# Run everything manually:                 pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch          # work on feature/, bugfix/, chore/ branches
        args: [--branch, main]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        files: ^app/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  # These use your local virtualenv (pip install -r requirements-dev.txt), so the versions of
  # mypy and the libraries it type-checks against always match the pinned requirements.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (types; config in pyproject.toml)
        entry: python -m mypy
        language: system
        types_or: [python, toml]
        pass_filenames: false
      # Slower checks run before pushing.
      - id: pytest
        name: pytest with coverage gate
        entry: python -m pytest -q --cov --cov-report=term
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pip-audit
        name: pip-audit (known vulnerabilities)
        entry: pip-audit -r requirements.txt --progress-spinner off
        language: system
        pass_filenames: false
        files: ^requirements.*\.txt$
        stages: [pre-push]
