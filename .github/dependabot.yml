version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci, patch]
