name: Release drafter

on:
  push:
    branches: [main]
  # pull_request_target so PRs get labelled; this workflow never checks out PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  label-pr:
    name: Label PR from branch name and files
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: autolabeler.yml

  version-label:
    name: Exactly one version label
    if: github.event_name == 'pull_request_target'
    needs: label-pr
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          echo "Labels: $labels"
          n=$(printf '%s\n' "$labels" | grep -cxE 'major|minor|patch|skip-changelog' || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::Add exactly one of: major, minor, patch, skip-changelog (feature/ branches get minor, bugfix/ and chore/ get patch automatically)."
            exit 1
          fi
          if printf '%s\n' "$labels" | grep -qx major; then
            echo "::warning::This PR raises the MAJOR version. Only for serious, incompatible changes approved by the maintainer."
          fi

  draft-release:
    name: Update draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
